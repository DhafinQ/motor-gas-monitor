version: '3.8'

services:
  # 1. InfluxDB
  influxdb:
    image: influxdb:2.7
    container_name: influxdb_factory
    restart: always
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUX_ADMIN_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_ADMIN_PASS}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 2. Node-RED
  nodered:
    build: ./nodered-data
    container_name: nodered_factory
    restart: always
    ports:
      - "1880:1880"
    env_file:
      - .env  # <-- Otomatis melempar SELURUH isi file .env ke environment Node-RED
    environment:
      FLOWS: flows.json
      INFLUX_URL: http://influxdb_factory:8086
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      INFLUX_TOKEN: ${INFLUX_TOKEN}    
      EMAIL_USER: ${EMAIL_USER}    
      EMAIL_PASS: ${EMAIL_PASS}    
    volumes:
      - ./nodered-data:/data
    depends_on:
      influxdb:
        condition: service_healthy

  # 3. Grafana
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana_factory
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - INFLUX_ORG: ${INFLUX_ORG}
      - INFLUX_BUCKET: ${INFLUX_BUCKET}
      - INFLUX_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - influxdb

  # 4. Fake PLC
  fake-plc:
    build: ./fake-plc
    container_name: fake_plc_sim
    restart: always
    profiles: ["plc"]
    ports:
      - "502:502"

volumes:
  influxdb_data:
  grafana_data: